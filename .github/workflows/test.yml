name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Install location_bridge plugin dependencies
        working-directory: packages/location_bridge
        run: flutter pub get

      - name: Install device_admin_bridge plugin dependencies
        working-directory: packages/device_admin_bridge
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Run location_bridge plugin tests
        working-directory: packages/location_bridge
        run: flutter test

      - name: Run device_admin_bridge plugin tests
        working-directory: packages/device_admin_bridge
        run: flutter test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, pdo_mysql

      - name: Lint PHP syntax
        run: |
          for f in $(find backend/api -name "*.php"); do
            php -l "$f"
          done

      - name: Run Totp tests
        run: php backend/tests/totp_test.php
