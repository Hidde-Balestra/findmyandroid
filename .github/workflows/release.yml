name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install location_bridge plugin dependencies
        working-directory: packages/location_bridge
        run: flutter pub get

      - name: Install device_admin_bridge plugin dependencies
        working-directory: packages/device_admin_bridge
        run: flutter pub get

      - name: Install camera_bridge plugin dependencies
        working-directory: packages/camera_bridge
        run: flutter pub get

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Decode release keystore
        working-directory: app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks

      - name: Write signing config
        working-directory: app
        run: |
          cat <<EOF > android/key.properties
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: app
        # A single universal APK (all ABIs bundled in one file) instead of
        # --split-per-abi's 3 separate files -- one download, no need to
        # figure out which ABI matches the phone. Larger file size is the
        # trade-off, which doesn't matter for direct-download installs like
        # this (it would for a Play Store upload, which this isn't).
        run: flutter build apk --release

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
