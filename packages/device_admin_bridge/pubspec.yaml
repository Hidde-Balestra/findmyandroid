name: device_admin_bridge
description: "Bridges Android's Device Administrator APIs so the app can be notified of failed lock-screen unlock attempts -- the only way a regular app can observe that at all."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: nl.hiddebalestra.device_admin_bridge
        pluginClass: DeviceAdminBridgePlugin
