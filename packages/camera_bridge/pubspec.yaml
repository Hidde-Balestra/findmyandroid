name: camera_bridge
description: "Captures a single still frame from the front camera using Android's Camera2 API directly, with no Activity required -- unlike the official camera plugin, this works from a headless background isolate."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: nl.hiddebalestra.camera_bridge
        pluginClass: CameraBridgePlugin
