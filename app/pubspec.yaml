name: findmyandroid
description: "Find My Android - a privacy-first, Google-Play-Services-free device locator."
publish_to: 'none'

# The build number (versionCode) jumps to 5000 here on purpose: every
# release through v0.3.2 used `flutter build apk --split-per-abi`, which
# adds a per-ABI offset on top of the actual build number (armeabi-v7a
# +1000, arm64-v8a +2000, x86_64 +4000) -- so anyone who installed the
# arm64-v8a build of v0.3.2 (build 10) actually has versionCode 2010
# installed, and the x86_64 build would be 4010. Since v0.3.3 switched to
# one universal APK with no such offset, continuing to increment normally
# from 12 would make every new release look like a downgrade to Android
# and silently fail to install over an old split build ("App not
# installed", no further detail) for anyone still on v0.3.2 or earlier.
# 5000 clears the highest possible previously-installed value (4010) with
# room to spare; every later release just increments normally from here.
version: 0.4.1+5000

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Ring-at-max-volume / DND-bypass engine (same package used by the alarm app).
  alarm: ^5.5.0
  flutter_riverpod: ^2.6.1
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.4
  qr_flutter: ^4.1.0

  # Local plugin: reads location via Android's built-in LocationManager,
  # deliberately bypassing Google Play Services / the fused location API.
  location_bridge:
    path: ../packages/location_bridge

  # Local plugin: Device Administrator bridge, so the security-snapshot
  # feature can also trigger on failed lock-screen unlock attempts.
  device_admin_bridge:
    path: ../packages/device_admin_bridge

  # Local plugin: captures a front-camera still via Camera2 directly (no
  # Activity needed, unlike the official `camera` package), so the security
  # snapshot can actually get a photo from the headless background isolate
  # the lock-screen trigger runs in.
  camera_bridge:
    path: ../packages/camera_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3D5AFE"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
