name: findmyandroid
description: "Find My Android - a privacy-first, Google-Play-Services-free device locator."
publish_to: 'none'

version: 0.1.2+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Ring-at-max-volume / DND-bypass engine (same package used by the alarm app).
  alarm: ^5.5.0
  flutter_riverpod: ^2.6.1
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  http: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.4
  qr_flutter: ^4.1.0

  # Local plugin: reads location via Android's built-in LocationManager,
  # deliberately bypassing Google Play Services / the fused location API.
  location_bridge:
    path: ../packages/location_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3D5AFE"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
